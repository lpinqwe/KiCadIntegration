[changelog]
header = "# Changelog\n\nВсе изменения проекта. Версия определяется мержем PR; идентификатор — номер PR.\n\n"
body = """
{% if version %}\
## {{ version }}{% if commit.remote and commit.remote.pr_number %} — PR #{{ commit.remote.pr_number }}{% else %} — без PR{% endif %}{% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}
{% else %}\
## Unreleased{% if commit.remote and commit.remote.pr_number %} — PR #{{ commit.remote.pr_number }}{% else %} — PR #1{% endif %}{% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {{ commit.message | upper_first | trim }}
{% endfor %}\
{% endfor %}"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^ci", group = "Changed" },
    { message = "^chore", group = "Changed" },
    { message = "^docs", group = "Docs" },
    { message = "^test", group = "Tests" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "lpinqwe"
repo = "KiCadIntegration"
